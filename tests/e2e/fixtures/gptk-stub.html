<!doctype html>
<!--
  GPTK Stub Page
  ==============
  A minimal Google Photos lookalike served via context.route() intercept on
  https://photos.google.com/* in integration tests.

  The extension's bridge content script (google-photos-bridge.ts) is injected
  automatically because this page's URL matches the content script's "matches"
  pattern. The bridge relays:
    - gptkCommand  →  chrome.runtime.sendMessage → window.postMessage (incoming here)
    - gptkResult   →  window.postMessage → chrome.runtime.sendMessage (outgoing here)

  This stub listens for gptkCommand messages on window and replies with
  pre-programmed gptkResult / gptkProgress responses. Override behaviour
  by setting window.__gptkOverrides before navigation or via page.evaluate().

  Supported commands:
    healthCheck     → { hasGptk, hasWizData, accountEmail }
    listAlbums       → small album list for scan-scope tests
    getAllMediaItems → []   (empty; scan tests use injected storage)
    trashItems      → emits per-chunk gptkProgress + final gptkResult
    restoreItems    → immediate gptkResult success

  Force failure for any command by setting:
    window.__gptkOverrides = { trashItems: { success: false, error: "..." } }
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google Photos (stub)</title>
  </head>
  <body>
    <p>Google Photos stub — integration test fixture</p>

    <script>
      const APP_ID = "GPD"
      const TRASH_BATCH_SIZE = 25

      /**
       * Per-command response overrides. Tests can inject:
       *   await page.evaluate(() => {
       *     window.__gptkOverrides = { trashItems: { success: false, error: "HTTP 504" } }
       *   })
       */
      window.__gptkOverrides = window.__gptkOverrides || {}
      window.__gptkCommandLog = window.__gptkCommandLog || []
      window.__gptkHeldRestoreResponses =
        window.__gptkHeldRestoreResponses || Object.create(null)
      window.__gptkProviderSessionId =
        window.__gptkProviderSessionId || window.crypto.randomUUID()
      window.__GPD_GOOGLE_COMMAND_HANDLER_LOADED__ = true
      window.gptkApi = window.gptkApi || {}
      window.WIZ_global_data = window.WIZ_global_data || {
        oPEP7c: "test@example.com"
      }

      /**
       * Default programmed responses per command.
       * These match the real GPTK response shapes captured from the live extension.
       */
      const DEFAULT_RESPONSES = {
        healthCheck: {
          hasGptk: true,
          hasWizData: true,
          accountEmail: "test@example.com"
        },
        listAlbums: [
          {
            mediaKey: "album-1",
            title: "Tiny test album",
            itemCount: 3,
            isShared: false
          },
          {
            mediaKey: "album-2",
            title: "Shared album",
            itemCount: 12,
            isShared: true
          }
        ],
        getAllMediaItems: []
      }

      function responseOverride(command) {
        const override = window.__gptkOverrides[command]
        if (!override || !Array.isArray(override.sequence)) return override
        const commandIndex = window.__gptkCommandLog.filter(
          (entry) => entry.command === command
        ).length - 1
        return (
          override.sequence[
            Math.min(commandIndex, override.sequence.length - 1)
          ] || {}
        )
      }

      async function applyResponseDelay(override) {
        const delayMs = Number(override && override.delayMs)
        if (Number.isFinite(delayMs) && delayMs > 0) {
          await new Promise((resolve) => setTimeout(resolve, delayMs))
        }
      }

      function reply(command, requestId, data, scanCoverage, providerSessionId) {
        window.postMessage({
          app: APP_ID,
          action: "gptkResult",
          command,
          requestId,
          success: true,
          data,
          ...(providerSessionId ? { providerSessionId } : {}),
          ...(scanCoverage !== undefined ? { scanCoverage } : {})
        })
      }

      function replyError(command, requestId, error, data, providerSessionId) {
        window.postMessage({
          app: APP_ID,
          action: "gptkResult",
          command,
          requestId,
          success: false,
          error,
          ...(providerSessionId ? { providerSessionId } : {}),
          ...(data !== undefined ? { data } : {})
        })
      }

      function progress(command, requestId, itemsProcessed, data, providerSessionId) {
        window.postMessage({
          app: APP_ID,
          action: "gptkProgress",
          command,
          requestId,
          itemsProcessed,
          ...(providerSessionId ? { providerSessionId } : {}),
          ...(data !== undefined ? { data } : {})
        })
      }

      async function handleTrashItems(command, requestId, args) {
        const override = responseOverride(command)
        if (override && override.success === false) {
          replyError(
            command,
            requestId,
            override.error || "Stub: trashItems failed",
            override.data,
            args?.providerSessionId
          )
          return
        }
        await applyResponseDelay(override)

        const dedupKeys = (args && args.dedupKeys) || []
        const mediaKeysToTrash = (args && args.mediaKeysToTrash) || dedupKeys
        const requestedBatchSize = Number(args && args.batchSize)
        const batchSize =
          Number.isFinite(requestedBatchSize) && requestedBatchSize > 0
            ? Math.min(Math.floor(requestedBatchSize), TRASH_BATCH_SIZE)
            : TRASH_BATCH_SIZE

        // Emit one gptkProgress per completed batch (mirroring real GPTK behaviour)
        for (let i = batchSize; i < dedupKeys.length; i += batchSize) {
          progress(
            command,
            requestId,
            Math.min(i, dedupKeys.length),
            undefined,
            args?.providerSessionId
          )
          // Yield to allow the bridge to relay before the next iteration
          await new Promise((r) => setTimeout(r, 0))
        }

        // Final progress (full count) + result
        progress(
          command,
          requestId,
          dedupKeys.length,
          undefined,
          args?.providerSessionId
        )
        reply(command, requestId, {
          trashedCount: dedupKeys.length,
          trashedKeys: mediaKeysToTrash,
          trashedDedupKeys: dedupKeys,
          retryAttempts: 0
        }, undefined, args?.providerSessionId)
      }

      async function handleRestoreItems(command, requestId, args) {
        const override = responseOverride(command)
        await applyResponseDelay(override)
        if (override && override.success === false) {
          replyError(
            command,
            requestId,
            override.error || "Stub: restoreItems failed",
            override.data,
            args?.providerSessionId
          )
          return
        }
        if (override?.holdResponse === true) {
          if (override.progressData !== undefined) {
            progress(
              command,
              requestId,
              Number(override.progressItemsProcessed) || 0,
              override.progressData,
              args?.providerSessionId
            )
          }
          window.__gptkHeldRestoreResponses[requestId] = (data) => {
            delete window.__gptkHeldRestoreResponses[requestId]
            reply(command, requestId, data, undefined, args?.providerSessionId)
          }
          return
        }
        const restoredDedupKeys = Array.isArray(args?.dedupKeys)
          ? args.dedupKeys
          : []
        reply(command, requestId, {
          restoredCount: restoredDedupKeys.length,
          restoredDedupKeys
        }, undefined, args?.providerSessionId)
      }

      window.addEventListener("message", async (event) => {
        if (event.source !== window) return
        const msg = event.data
        if (!msg || msg.app !== APP_ID || msg.action !== "gptkCommand") return

        const { command, requestId, args } = msg
        window.__gptkCommandLog.push({ command, requestId, args })

        switch (command) {
          case "trashItems":
            await handleTrashItems(command, requestId, args)
            break

          case "restoreItems":
            await handleRestoreItems(command, requestId, args)
            break

          default: {
            const override = responseOverride(command)
            await applyResponseDelay(override)
            if (override && override.success === false) {
              replyError(
                command,
                requestId,
                override.error || `Stub: ${command} failed`,
                undefined,
                args?.providerSessionId
              )
            } else {
              const data =
                (override && override.data) ||
                DEFAULT_RESPONSES[command] ||
                null
              const scanCoverage =
                command === "getAllMediaItems"
                  ? override?.scanCoverage || {
                      status: "complete",
                      stopReason: "exhausted",
                      itemsVisited: Array.isArray(data) ? data.length : 0,
                      itemsReturned: Array.isArray(data) ? data.length : 0,
                      itemsSkipped: 0,
                      unknownDateItemsSkipped: 0,
                      mediaTypesCovered: { photos: true, videos: true },
                      canResume: false
                    }
                  : undefined
              const providerSessionId =
                (data && data.providerSessionId) ||
                args?.providerSessionId ||
                (command === "healthCheck"
                  ? window.__gptkProviderSessionId
                  : undefined)
              reply(
                command,
                requestId,
                data,
                scanCoverage,
                providerSessionId
              )
            }
          }
        }
      })

      console.log(
        "[GPD stub] GPTK stub page loaded — ready for gptkCommand messages"
      )
    </script>
  </body>
</html>
