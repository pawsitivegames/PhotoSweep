name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_BASE_URL: https://photosweep-license-api-206538169327.us-west1.run.app
      PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_HOST_PERMISSION: https://photosweep-license-api-206538169327.us-west1.run.app/*
      PLASMO_PUBLIC_PHOTOSWEEP_ALLOW_DEV_ENTITLEMENT: "0"
      PLASMO_PUBLIC_PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY: ${{ secrets.PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked out commit does not match the tagged GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not reachable from origin/main" >&2
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Google-Photos-Toolkit dependencies
        run: npm ci
        working-directory: Google-Photos-Toolkit

      - name: Typecheck
        run: npm run typecheck

      - name: Run release tests
        run: npm test

      - name: Build production package
        run: npm run package

      - name: Audit extension package
        run: npm run audit:extension-package

      - name: Rename release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp build/chrome-mv3-prod.zip "build/photosweep-${RELEASE_TAG}.zip"
          cp build/chrome-mv3-prod.zip build/photosweep.zip

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photosweep-release-${{ github.sha }}
          path: |
            build/photosweep-${{ github.ref_name }}.zip
            build/photosweep.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: photosweep-release-${{ github.sha }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            release-assets/photosweep-${{ github.ref_name }}.zip
            release-assets/photosweep.zip
