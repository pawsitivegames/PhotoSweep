name: Build Extension Package

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Backend environment to embed in the extension package"
        type: choice
        required: true
        default: sandbox
        options:
          - sandbox
          - production

permissions:
  contents: read

jobs:
  build-package:
    name: Build ${{ inputs.environment }} Chrome package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Configure extension release environment
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          ENTITLEMENT_PUBLIC_KEY: ${{ secrets.PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ENTITLEMENT_PUBLIC_KEY}" ]]; then
            echo "PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY repository secret is required" >&2
            exit 1
          fi
          # Until PhotoSweep has a custom domain, both sandbox and production
          # extension packages use the verified Cloud Run backend URL.
          api_base="https://photosweep-license-api-206538169327.us-west1.run.app"
          {
            echo "PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_BASE_URL=${api_base}"
            echo "PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_HOST_PERMISSION=${api_base}/*"
            echo "PLASMO_PUBLIC_PHOTOSWEEP_ALLOW_DEV_ENTITLEMENT=0"
            echo "PLASMO_PUBLIC_PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY=${ENTITLEMENT_PUBLIC_KEY}"
          } >> "$GITHUB_ENV"

      - name: Install root dependencies
        run: npm ci

      - name: Install Google-Photos-Toolkit dependencies
        run: npm ci
        working-directory: Google-Photos-Toolkit

      - name: Install pinned TLC tooling
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jre-headless
          fi
          jar_path="${RUNNER_TEMP}/photosweep-tlc-1.8.0.jar"
          curl --fail --location --retry 3 \
            --output "${jar_path}" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' \
            '7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d' \
            "${jar_path}" | sha256sum --check
          echo "TLA_TOOLS_JAR=${jar_path}" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Exclude retained CI verification diagnostics from source status
        run: |
          set -euo pipefail
          exclude_file="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "${exclude_file}")"
          touch "${exclude_file}"
          for pattern in \
            '/tmp/verification/runner-corruption-*/' \
            '/tmp/verification/runner-reuse-*/'
          do
            if ! grep -Fqx "${pattern}" "${exclude_file}"; then
              printf '%s\n' "${pattern}" >> "${exclude_file}"
            fi
          done

      - name: Run release tests
        run: npm test

      - name: Assert clean source before packaging
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            git status --short
            echo "Refusing to package a dirty source checkout." >&2
            exit 1
          fi

      - name: Build and package extension
        run: npm run package

      - name: Audit extension package
        run: npm run audit:extension-package

      - name: Rename package artifact
        run: |
          cp build/chrome-mv3-prod.zip "build/photosweep-${{ inputs.environment }}-${{ github.sha }}.zip"

      - name: Upload extension package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photosweep-${{ inputs.environment }}-chrome-mv3
          path: |
            build/photosweep-${{ inputs.environment }}-${{ github.sha }}.zip
            build/chrome-mv3-prod/manifest.json
          retention-days: 14
